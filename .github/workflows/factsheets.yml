# Reads AUM, AAUM, portfolio turnover and Direct BER from the latest AMC factsheets and saves
# them in published/factsheet_values.csv, which the app loads on start.
#
# Runs on the 12th, 18th and 25th of each month (AMCs publish factsheets 1-3 weeks after the
# month ends), and on demand: Actions tab > "Factsheet values" > Run workflow.
# A commit is made only when a value changed. The job is marked failed when a fund's factsheet
# could not be read or a value was flagged (see the step log); the values read are still saved.
# The commit goes straight to main, so main must accept pushes from github-actions[bot].
name: Factsheet values

on:
  schedule:
    - cron: "30 3 12,18,25 * *"  # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write  # to commit published/factsheet_values.csv

concurrency:
  group: factsheet-values
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # AMFI TER for the last two months (some factsheets hold data a month older), so the
      # factsheet BER can be checked against it. Not saved; without it the BER is not checked.
      - name: Fetch AMFI TER for the BER check
        run: |
          for back in 1 2; do
            month=$(date -u -d "$(date -u +%Y-%m-01) -$back month" +%m-%Y)
            python -m arbitrage_analyser fetch-ter --month "$month" || echo "No AMFI TER for $month"
          done

      - name: Read the latest factsheets
        id: fetch
        run: python -m arbitrage_analyser fetch-factsheets || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Save changed values
        run: |
          if [ -z "$(git status --porcelain -- published/factsheet_values.csv)" ]; then
            echo "No new values."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/factsheet_values.csv
          git commit -m "Factsheet values: update from AMC factsheets"
          git pull --rebase
          git push

      - name: Fail if a factsheet could not be read or a value was flagged
        if: steps.fetch.outputs.failed == 'true'
        run: |
          echo "See the 'Read the latest factsheets' step for the funds and flags."
          exit 1
