# Refreshes the data store (published/*.csv) from the APIs and commits the files that changed.
# The app loads published/ when it starts, so the data survives Streamlit Cloud restarts.
#
#   NAV and TER: every weekday night (03:15 IST Tue-Sat, after AMFI publishes the day's NAV).
#   Factsheet values: also on the 12th, 18th and 25th (factsheets come 1-3 weeks after month end).
#   By hand: Actions tab > "Refresh data" > Run workflow (choose whether to read factsheets).
#
# The run is marked failed when a source could not be read or a new value was flagged; the step
# log names them, and what was fetched is still saved. Commits go straight to main, so main must
# accept pushes from github-actions[bot].
name: Refresh data

on:
  schedule:
    - cron: "45 21 * * 1-5"      # 03:15 IST next day: NAV and TER
    - cron: "30 3 12,18,25 * *"  # 09:00 IST: NAV, TER and factsheets
  workflow_dispatch:
    inputs:
      factsheets:
        description: "Also read the AMC factsheets"
        type: boolean
        default: false

permissions:
  contents: write  # to commit published/

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Fetch new data
        id: fetch
        env:
          FACTSHEETS: ${{ github.event.schedule == '30 3 12,18,25 * *' || inputs.factsheets }}
        run: |
          datasets=nav,ter
          if [ "$FACTSHEETS" = "true" ]; then datasets=nav,ter,factsheets; fi
          python -m arbitrage_analyser update-data --datasets "$datasets" \
            || echo "failed=true" >> "$GITHUB_OUTPUT"

      # Only the files this job writes (the app writes benchmark.csv and reviewed_flags.csv),
      # so a commit from the app meanwhile cannot conflict. Retries if main moved on.
      - name: Save changed data
        run: |
          for file in funds nav ter factsheet_values; do
            if [ -f "published/$file.csv" ]; then git add -- "published/$file.csv"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: refresh from APIs"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Could not push the data after 3 attempts."
          exit 1

      - name: Fail if a source could not be read or a value was flagged
        if: steps.fetch.outputs.failed == 'true'
        run: |
          echo "See the 'Fetch new data' step for the sources and flags."
          exit 1
