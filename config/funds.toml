# Arbitrage Fund Analyser - fund configuration.
#
# Edit this file to add funds or update exit loads and fund managers.
# Every fund must be the DIRECT plan, GROWTH option.
#
# amfi_code  : AMFI scheme code. Checked against the NAV source on every refresh.
# isin       : ISIN of the direct growth plan. Must match the NAV source.
# ter_match  : text that identifies the fund's row in the AMFI TER file (case-insensitive).
#              Used only when [settings.features] ter = true.
# exit_load_pct / exit_load_days : 0 and 0 means no exit load.
#
# fund_managers : a name, or { name = "...", since = "YYYY-MM-DD" } (or "YYYY-MM" when only the
#                 month is published). Shown as "Name (since 03-Oct-2019)" / "Name (since Dec 2014)".
#
# Values below were checked on 07/08-Oct-2026. Sources are noted per fund.
# Fund managers from Zerodha Coin may list only the lead manager.

[settings]
history_start = "2019-01-01"     # NAV and benchmark data are stored from this date
benchmark_name = "NIFTY 50 Arbitrage"
exit_load_flag_above_pct = 0.25  # Fund comparison flags exit loads above this
outlier_multiplier = 10.0        # Flag a daily move above N x the median daily move
outlier_lookback_days = 250      # Trading days used to compute the median daily move
outlier_min_history = 60         # Skip the outlier check until this many days exist
max_gap_days = 5                 # Flag a gap longer than this many calendar days
overlap_tolerance = 0.01         # Benchmark re-upload must match stored values within this

# Switch optional datasets on or off. Off hides their columns, uploads, commands and freshness rows.
[settings.features]
ter = false    # TER breakdown from the AMFI TER file
aaum = false   # Average AUM from the AMFI AAUM file

# Freshness: days since the latest data date. Due after the first number, Overdue after the second.
[settings.freshness]
nav = [4, 7]
ter = [45, 60]
aaum = [110, 140]
benchmark = [45, 60]

